<!doctype html>
<html lang="ar" dir="rtl" data-p="PS4"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختيار ألعاب PlayStation للطباعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--sf:#fff;--ink:#101b33;--mut:#5b6881;--ln:#d8dfea;--ac:#0b5bd3;--act:#e6efff}
[data-p=PS5]{--ac:#5a3fd0;--act:#eeeaff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:78px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px}
.top{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:19px;margin:0}.sub{color:var(--mut);font-size:13px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;min-width:250px}
.seg i{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;background:var(--ac);border-radius:999px;transition:inset-inline-start .25s,background .25s}
[data-p=PS5] .seg i{inset-inline-start:50%}
.seg button{position:relative;border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--mut);transition:color .2s}
.seg button[aria-checked=true]{color:#fff}.seg small{font-weight:400;opacity:.85;margin-inline-start:6px}
.b{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px}
.b:hover{border-color:var(--ac)}.b.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:16px 0}
.row{display:flex;gap:8px;margin-top:6px}.row input{flex:1}
.panel label>span{font-weight:600}
input,select{border:1px solid var(--ln);border-radius:10px;padding:8px 12px;background:var(--sf);min-width:0}
.hint{margin:8px 0 0;color:var(--mut);font-size:13px}
#fb{margin-top:8px;font-size:14px}#fb p{margin:2px 0}.w{color:#b4430f}.o{color:#157347}
.pg{background:#fff7e6;border:1px solid #f0cf8a;border-radius:14px;padding:12px;margin-bottom:16px}
.pg h3{margin:0 0 8px;font-size:15px}.pg .g{padding:8px 0;border-top:1px solid #f0dcae}
.pg .cs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.pg .card{width:130px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools #q{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.card{position:relative;border:2px solid transparent;background:var(--sf);border-radius:14px;padding:8px;text-align:start;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px #1b2a4a14;content-visibility:auto;contain-intrinsic-size:260px 300px}
.card[aria-pressed=true]{border-color:var(--ac);background:var(--act)}
.im{aspect-ratio:5/6;border-radius:9px;overflow:hidden;background:#dfe5ef}.im img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;text-align:center;padding:8px;font-size:12px;color:var(--mut);width:100%;height:100%;background:#e4e8f0}
.num{font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.tick{position:absolute;top:14px;inset-inline-start:14px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:none;place-items:center;font-weight:700}
.card[aria-pressed=true] .tick{display:grid}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
.bar{position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);z-index:6}
.bar .wrap{display:flex;gap:16px;align-items:center}.bar .p{margin-inline-start:auto}
dialog{border:0;border-radius:16px;padding:20px;max-width:440px;width:92vw}dialog::backdrop{background:#101b3399}
#pv{max-width:960px;width:96vw;height:92vh;padding:0;flex-direction:column}#pv[open]{display:flex}
.ph2,.pf{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--sf)}.ph2{border-bottom:1px solid var(--ln)}.pf{border-top:1px solid var(--ln);justify-content:space-between}
.ph2 b{font-size:17px}.pill{background:var(--act);color:var(--ac);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
#pvb{flex:1;overflow:auto;background:#aab4c5;padding:14px 12px}
.sw{width:calc(210mm*var(--s));height:calc(296mm*var(--s));margin:0 auto 14px;position:relative}
.sw .sheet{position:absolute;top:0;left:0;transform:scale(var(--s));transform-origin:0 0;box-shadow:0 2px 12px #0004}
.lbl{text-align:center;font-size:12px;color:#fff;margin-bottom:4px}
#toast{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:fit-content;max-width:92vw;background:#101b33;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
#md h2{margin:0 0 8px;font-size:17px}#md ul{padding-inline-start:20px;max-height:40vh;overflow:auto}#md form{display:flex;gap:8px;justify-content:flex-end}
#pr{display:none}
.sheet{width:210mm;height:296mm;padding:8mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6mm;background:#fff;overflow:hidden;direction:ltr}
.pc{margin:0;display:flex;flex-direction:column;border:.3mm solid #c3ccdb;border-radius:3mm;overflow:hidden;min-height:0}
.pi{flex:1;min-height:0;background:#f1f3f7;display:flex}.pi img{width:100%;height:100%;object-fit:contain}.pi .ph{font-size:14pt}
.cap{flex:none;height:18mm;padding:1.5mm 3mm;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;border-top:.3mm solid #c3ccdb;background:#fff}
.pn{font-size:24pt;font-weight:700;line-height:1.1;color:#000}.pt{width:100%;font-size:15pt;font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:#000}
@media print{@page{size:A4 portrait;margin:0}
html,body{background:#fff;padding:0}body>*:not(#pr){display:none!important}#pr{display:block}
.sheet{break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="wrap top">
 <div><h1>أغلفة الألعاب للطباعة</h1><div class="sub" id="lib"></div></div>
 <div class="seg" role="radiogroup" aria-label="فئة الألعاب"><i></i>
  <button role="radio" data-p="PS4" aria-checked="true">PS4 - <small id="c4"></small></button>
  <button role="radio" data-p="PS5" aria-checked="false">PS5 - <small id="c5"></small></button></div>
 <div><button class="b" id="imp">استيراد ملف JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</div></header>
<main class="wrap">
 <section class="panel"><label><span>أرقام الألعاب</span>
  <div class="row"><input id="nums" inputmode="numeric" autocomplete="off" placeholder="مثال: 10-40، 105، 280، 340-350"><button class="b p" id="addn">إضافة إلى الاختيارات</button></div></label>
  <p class="hint">أدخل آخر ثلاثة أرقام من رقم اللعبة، منفردة أو نطاقات. تُضاف إلى اختياراتك دون حذف السابق، وتقتصر على الفئة الظاهرة.</p>
  <div id="fb" role="status" aria-live="polite"></div></section>
 <section id="pend"></section>
 <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم أو الرقم">
  <select id="so" aria-label="الترتيب"><option value="1">الرقم تصاعديًا</option><option value="-1">الرقم تنازليًا</option></select>
  <button class="b" id="selv">تحديد الظاهر</button><button class="b" id="clr">مسح الاختيارات</button><span id="cnt" class="sub"></span></div>
 <div id="grid" class="grid"></div>
</main>
<div class="bar"><div class="wrap"><b id="sc"></b><span class="sub" id="pgc"></span><button class="b p" id="prev">معاينة وطباعة</button></div></div>
<dialog id="pv"><div class="ph2"><b>معاينة الطباعة</b><span class="pill" id="pg1"></span><span class="pill" id="pg2"></span></div>
 <div id="pvb"></div><div class="pf"><button class="b" id="back">العودة إلى الاختيار</button><button class="b p" id="prt">طباعة</button></div></dialog>
<dialog id="md"></dialog><div id="toast"></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
let games=[],idx={PS4:new Map(),PS5:new Map()},plat='PS4',sel=new Set(),pend=[],dir=1,q='',src='';
function norm(a){const list=[],bad=[];a.forEach((r,i)=>{const o=r&&typeof r=='object',s=o?String(r.id??'').trim():'',id=/^\d+$/.test(s)?+s:NaN,p=o?String(r.platform??'').toUpperCase().replace(/\s/g,''):'',nm=o?String(r.name??'').trim():'';
 if(!Number.isSafeInteger(id))bad.push(`السجل ${i+1}: الحقل id غير صالح`);else if(!nm)bad.push(`السجل ${i+1}: الاسم مفقود`);else if(p!='PS4'&&p!='PS5')bad.push(`السجل ${i+1}: قيمة platform غير معروفة`);
 else list.push({uid:list.length,id,name:nm,platform:p,image:typeof r.image=='string'?r.image.trim():'',n:id%1000,ns:String(id%1000).padStart(3,'0')})});return{list,bad}}
function setLib(list,name,keepSel){games=list;src=name;idx={PS4:new Map(),PS5:new Map()};list.forEach(g=>{const m=idx[g.platform];(m.get(g.n)||m.set(g.n,[]).get(g.n)).push(g)});
 sel.clear();pend=[];q='';$('#q').value='';$('#nums').value='';$('#fb').innerHTML='';$('#c4').textContent=idx.PS4.size?[...idx.PS4.values()].reduce((a,l)=>a+l.length,0):0;$('#c5').textContent=[...idx.PS5.values()].reduce((a,l)=>a+l.length,0);
 $('#lib').textContent=name?`${list.length} لعبة — ${name}`:'لم تُحمَّل مكتبة بعد';render()}
const view=()=>{const t=toEn(q.trim().toLowerCase()),d=/^\d+$/.test(t);return games.filter(g=>g.platform===plat&&(!t||g.name.toLowerCase().includes(t)||(d&&g.ns.includes(t)))).sort((a,b)=>dir*(a.n-b.n)||dir*(a.id-b.id))};
const picked=()=>games.filter(g=>g.platform===plat&&sel.has(g.uid)).sort((a,b)=>dir*(a.n-b.n)||dir*(a.id-b.id));
const img=(g,lazy)=>g.image?`<img src="${esc(g.image)}" data-n="${esc(g.name)}" alt="" referrerpolicy="no-referrer" ${lazy?'loading="lazy" decoding="async"':'loading="eager"'}>`:`<div class="ph">${esc(g.name)}</div>`;
const card=g=>`<button type="button" class="card" data-uid="${g.uid}" aria-pressed="${sel.has(g.uid)}"><span class="tick">✓</span><div class="im">${img(g,1)}</div><span class="num">${g.ns}</span><span class="nm" dir="auto">${esc(g.name)}</span></button>`;
function render(){const v=view();$('#grid').innerHTML=v.length?v.map(card).join(''):`<div class="empty">${games.length?'لا توجد ألعاب مطابقة.':'لم تُحمَّل أي مكتبة بعد. اضغط «استيراد ملف JSON» واختر ملف games.json.'}</div>`;$('#cnt').textContent=`المعروض: ${v.length}`;renderPend();bar()}
function bar(){const n=picked().length;$('#sc').textContent=`المحدد: ${n}`;$('#pgc').textContent=n?`الصفحات: ${Math.ceil(n/4)}`:''}
function sync(){document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-pressed',sel.has(+c.dataset.uid)));bar()}
function renderPend(){const e=$('#pend');e.innerHTML=pend.length?`<div class="pg"><h3>أرقام تطابق أكثر من لعبة — اختر اللعبة المطلوبة</h3>${pend.map((p,i)=>`<div class="g"><b>الرقم ${String(p.n).padStart(3,'0')}</b><div class="cs">${p.l.map(card).join('')}</div><button class="b" data-all="${i}">إضافة الكل</button> <button class="b" data-skip="${i}">تجاهل</button></div>`).join('')}</div>`:''}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c){const u=+c.dataset.uid,inP=c.closest('#pend');sel.has(u)?sel.delete(u):sel.add(u);
 if(inP){const g=c.closest('.g'),i=[...g.parentNode.querySelectorAll('.g')].indexOf(g);if(sel.has(u))pend.splice(i,1);renderPend()}sync();return}
 const a=e.target.closest('[data-all],[data-skip]');if(a){const i=+(a.dataset.all??a.dataset.skip);if(a.dataset.all!=null)pend[i].l.forEach(g=>sel.add(g.uid));pend.splice(i,1);renderPend();sync()}});
document.addEventListener('error',e=>{const t=e.target;if(t.tagName=='IMG'&&t.dataset.n)ph(t)},true);
function ph(t){const d=document.createElement('div');d.className='ph';d.textContent=t.dataset.n;t.replaceWith(d)}
function parse(t){t=toEn(t).replace(/\s*[-–—−ـ]\s*/g,'-');const out=[],bad=[];t.split(/[,،;؛\s]+/).filter(Boolean).forEach(k=>{let m;
 if(m=k.match(/^(\d{1,3})$/))out.push([+m[1],+m[1]]);else if(m=k.match(/^(\d{1,3})-(\d{1,3})$/)){const a=+m[1],b=+m[2];out.push(a<=b?[a,b]:[b,a])}else bad.push(k)});return{out,bad}}
function applyNums(){const {out,bad}=parse($('#nums').value),ix=idx[plat],miss=[],er=[];let add=0,amb=0;
 if(!out.length&&!bad.length){fb([['w','أدخل رقمًا أو نطاقًا أولًا.']]);return}
 out.forEach(([a,b])=>{let f=0;for(let n=a;n<=b;n++){const l=ix.get(n);if(!l)continue;f++;if(l.length==1){if(!sel.has(l[0].uid)){sel.add(l[0].uid);add++}}else if(!pend.some(p=>p.n==n)){pend.push({n,l});amb++}}
  if(!f)(a==b?miss:er).push(a==b?String(a).padStart(3,'0'):a+'-'+b)});
 const m=[];if(add)m.push(['o',`تمت إضافة ${add} لعبة.`]);if(amb)m.push(['w',`${amb} رقم يطابق أكثر من لعبة؛ اختر اللعبة المطلوبة من الأعلى.`]);
 if(miss.length)m.push(['w',`لا توجد ألعاب ${plat} بالأرقام: ${miss.join('، ')}`]);if(er.length)m.push(['w',`نطاقات بلا ألعاب في ${plat}: ${er.join('، ')}`]);
 if(bad.length)m.push(['w',`مدخلات غير صالحة (أدخل من 1 إلى 3 أرقام فقط): ${bad.join('، ')}`]);if(!m.length)m.push(['o','كل الألعاب المطابقة محددة بالفعل.']);
 fb(m);renderPend();sync()}
const fb=m=>$('#fb').innerHTML=m.map(([c,t])=>`<p class="${c}">${esc(t)}</p>`).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(e.t);e.t=setTimeout(()=>e.className='',3200)}
function setPlat(p){if(p===plat)return;plat=p;sel.clear();pend=[];q='';$('#q').value='';$('#nums').value='';$('#fb').innerHTML='';
 document.documentElement.dataset.p=p;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-checked',b.dataset.p===p));render();toast('تم مسح الاختيارات عند تغيير الفئة')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setPlat(b.dataset.p));
$('#addn').onclick=applyNums;$('#nums').onkeydown=e=>{if(e.key=='Enter')applyNums()};
$('#q').oninput=e=>{q=e.target.value;render()};$('#so').onchange=e=>{dir=+e.target.value;render()};
$('#selv').onclick=()=>{const v=view();v.forEach(g=>sel.add(g.uid));sync();toast(`تم تحديد ${v.length} لعبة ظاهرة`)};
$('#clr').onclick=()=>{sel.clear();sync()};
const sheets=()=>{const L=picked(),P=[];for(let i=0;i<L.length;i+=4)P.push(L.slice(i,i+4));
 return P.map(p=>`<section class="sheet">${p.map(g=>`<figure class="pc"><div class="pi">${img(g,0)}</div><figcaption class="cap"><div class="pt" dir="ltr">${g.ns} - ${esc(g.name)}</div></figcaption></figure>`).join('')}</section>`)};
function fitText(root){root.querySelectorAll('.cap').forEach(c=>{const p=c.querySelector('.pt');if(!p)return;const av=c.clientHeight-2*parseFloat(getComputedStyle(c).paddingTop);let s=15;p.style.fontSize=s+'pt';while(s>6&&p.offsetHeight>av){s-=.5;p.style.fontSize=s+'pt'}})}
function fit(){const b=$('#pvb');b.style.setProperty('--s',Math.min(1,(b.clientWidth-24)/(210*96/25.4)))}
$('#prev').onclick=()=>{const S=sheets();if(!S.length){toast('حدّد لعبة واحدة على الأقل قبل المعاينة');return}
 $('#pvb').innerHTML=S.map((s,i)=>`<div class="lbl">صفحة ${i+1} من ${S.length}</div><div class="sw">${s}</div>`).join('');
 $('#pg1').textContent=`${picked().length} لعبة (${plat})`;$('#pg2').textContent=`${S.length} صفحة`;$('#pv').showModal();fit();fitText($('#pvb'));document.fonts&&document.fonts.ready.then(()=>$('#pv').open&&fitText($('#pvb')))};
addEventListener('resize',()=>$('#pv').open&&fit());$('#back').onclick=()=>$('#pv').close();
$('#prt').onclick=async()=>{const pr=$('#pr'),b=$('#prt');pr.innerHTML=sheets().join('');b.disabled=true;b.textContent='جارٍ تحميل الصور…';
 const ims=[...pr.querySelectorAll('img')];await Promise.all(ims.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,20000)})));
 pr.style.cssText='display:block;position:absolute;left:-99999px;top:0';await (document.fonts?document.fonts.ready:0);fitText(pr);pr.style.cssText='';let f=0;ims.forEach(i=>{if(i.isConnected&&i.complete&&!i.naturalWidth){ph(i)}});f=pr.querySelectorAll('.ph').length;
 b.disabled=false;b.textContent='طباعة';if(f)toast(`تعذّر تحميل ${f} صورة وستُطبع ببديل نصي`);setTimeout(()=>print(),150)};
addEventListener('afterprint',()=>$('#pr').innerHTML='');
function say(t,lines,ok){return new Promise(r=>{const d=$('#md');d.returnValue='0';d.innerHTML=`<h2>${esc(t)}</h2><ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><form method="dialog">${ok?`<button class="b p" value="1">${ok}</button>`:''}<button class="b" value="0">${ok?'إلغاء':'حسنًا'}</button></form>`;d.onclose=()=>r(d.returnValue=='1');d.showModal()})}
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;
 try{d=JSON.parse((await f.text()).replace(/^\uFEFF/,''))}catch(x){return say('الملف غير صالح',['الملف ليس JSON صحيحًا: '+x.message])}
 const a=Array.isArray(d)?d:d&&Array.isArray(d.games)?d.games:null;if(!a)return say('بنية غير مدعومة',['يجب أن يكون الملف مصفوفة ألعاب (أو كائنًا يحتوي الحقل games).']);
 const {list,bad}=norm(a);if(!list.length)return say('لا توجد سجلات صالحة',bad.slice(0,6).concat(bad.length?[]:['الملف فارغ']));
 if(bad.length&&!await say(`${bad.length} سجل غير صالح`,bad.slice(0,6).concat(bad.length>6?[`و${bad.length-6} أخرى…`]:[]),`استيراد ${list.length} سجل صالح`))return;
 setLib(list,f.name);try{localStorage.setItem('psp-lib',JSON.stringify({name:f.name,raw:list.map(({id,name,platform,image})=>({id,name,platform,image}))}))}catch(_){}
 toast(`تم استيراد ${list.length} لعبة ومُسحت الاختيارات`)};
setLib([],'');
(async()=>{let ok=false;try{const r=await fetch('games.json',{cache:'no-store'});if(r.ok){const d=await r.json(),a=Array.isArray(d)?d:d&&d.games,n=Array.isArray(a)&&norm(a);if(n&&n.list.length){setLib(n.list,'games.json (من المجلد تلقائيًا)');ok=true}}}catch(_){}
if(!ok){let st=null;try{st=JSON.parse(localStorage.getItem('psp-lib'))}catch(_){}const n=st&&Array.isArray(st.raw)&&norm(st.raw);if(n&&n.list.length)setLib(n.list,st.name+' (محفوظ من آخر استيراد)')}})();
window.PSP={setLib,norm,get sel(){return sel},get plat(){return plat}};
</script></body></html>
